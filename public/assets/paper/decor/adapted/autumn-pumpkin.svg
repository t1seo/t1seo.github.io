      <feColorMatrix in="noise" type="saturate" values="0" result="gray" />
      <feComponentTransfer in="gray" result="softGrain">
        <feFuncR type="linear" slope="0.16" intercept="0.84" />
        <feFuncG type="linear" slope="0.16" intercept="0.84" />
        <feFuncB type="linear" slope="0.16" intercept="0.84" />
        <feFuncA type="linear" slope="0" intercept="1" />
      </feComponentTransfer>
      <feComposite in="SourceGraphic" in2="softGrain" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" />
    </filter>
  </defs>
